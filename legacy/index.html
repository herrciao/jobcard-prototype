<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>改車單</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">

        <!-- 第一區：這是什麼 -->
        <div class="section header-section">
            <input type="text" id="partName" class="field-title" placeholder="品名" autocomplete="off">
            <div class="field-row">
                <input type="text" id="machine" class="field-half" placeholder="機台" autocomplete="off">
                <input type="text" id="material" class="field-half" placeholder="材料" autocomplete="off">
            </div>
            <div class="field-row">
                <input type="text" id="programId" class="field-half" placeholder="程式碼編號" autocomplete="off">
                <input type="text" id="cycleTime" class="field-half" placeholder="加工時間" autocomplete="off">
            </div>
            <div class="field-date" id="dateDisplay"></div>
        </div>

        <!-- 第二區：照片 -->
        <div class="section photo-section">
            <div class="photos-container" id="photosContainer"></div>
            <label for="photoInput" class="add-photo-btn">
                <span class="plus-icon">+</span>
                <span>拍照</span>
            </label>
            <input type="file" id="photoInput" accept="image/*" capture="environment" style="display:none;" multiple>
        </div>

        <!-- 第三區：設定資訊 -->
        <div class="section setup-section">
            <div class="section-label">設定</div>
            <div class="setup-grid">
                <div class="setup-item">
                    <span class="setup-label">主軸筒夾</span>
                    <input type="text" id="mainCollet" class="setup-input" autocomplete="off">
                </div>
                <div class="setup-item">
                    <span class="setup-label">導套</span>
                    <input type="text" id="guideBush" class="setup-input" autocomplete="off">
                </div>
                <div class="setup-item">
                    <span class="setup-label">背軸筒夾</span>
                    <input type="text" id="subCollet" class="setup-input" autocomplete="off">
                </div>
                <div class="setup-item">
                    <span class="setup-label">防震套</span>
                    <input type="text" id="antiVib" class="setup-input" autocomplete="off">
                </div>
                <div class="setup-item">
                    <span class="setup-label">送料機料夾</span>
                    <input type="text" id="feederClamp" class="setup-input" autocomplete="off">
                </div>
                <div class="setup-item">
                    <span class="setup-label">切削油</span>
                    <input type="text" id="coolant" class="setup-input" autocomplete="off">
                </div>
                <div class="setup-item">
                    <span class="setup-label">吐料棒尺寸</span>
                    <input type="text" id="ejectBar" class="setup-input" autocomplete="off">
                </div>
            </div>
        </div>

        <!-- 第四區：刀具表 -->
        <div class="section tools-section">
            <div class="section-label">刀具</div>
            <div id="toolsList" class="tools-list"></div>
            <button id="addToolBtn" class="add-tool-btn">+ 加一把刀</button>
        </div>

        <!-- 第五區：注意事項 -->
        <div class="section warning-section">
            <div class="section-label warning-label">注意事項</div>
            <textarea id="warnings" class="warning-textarea" placeholder="哪裡會有問題、要小心什麼…" rows="5"></textarea>
        </div>

        <!-- 第六區：影片 -->
        <div class="section video-section">
            <div id="videoPreview" class="video-preview" style="display:none;">
                <video id="videoElement" controls playsinline></video>
                <button class="media-delete" id="deleteVideo">×</button>
            </div>
            <label for="videoInput" class="add-video-btn" id="addVideoBtn">
                <span>+ 拍影片（選填）</span>
            </label>
            <input type="file" id="videoInput" accept="video/*" capture="environment" style="display:none;">
        </div>

        <!-- 第七區：備註 -->
        <div class="section notes-section">
            <textarea id="processNotes" class="notes-textarea" placeholder="其他備註…" rows="4"></textarea>
        </div>

    </div>

    <!-- 照片放大 -->
    <div id="photoModal" class="modal">
        <span class="modal-close" id="closeModal">×</span>
        <img id="modalImage" class="modal-img">
    </div>

    <script src="script.js"></script>
</body>
</html>
